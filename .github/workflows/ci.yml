name: Terraform CI

on:
  pull_request:
    branches: [main]
    paths:
      - "modules/**"
      - "examples/**"
      - "tests/**"
      - ".tflint.hcl"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "modules/**"
      - "examples/**"
      - "tests/**"
      - ".tflint.hcl"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

env:
  TF_VERSION: "1.9.8"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  fmt-and-validate:
    name: Format & Validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        working_dir:
          - modules/vpc
          - examples/dev
          - examples/stage
          - examples/prod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive -diff

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform init (no backend)
        working-directory: ${{ matrix.working_dir }}
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: ${{ matrix.working_dir }}
        run: terraform validate

  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.53.0

      - name: Init TFLint plugins
        working-directory: modules/vpc
        run: tflint --init --config ../../.tflint.hcl

      - name: Run TFLint on module and examples
        run: |
          for dir in modules/vpc examples/dev examples/stage examples/prod; do
            echo "Linting $dir..."
            tflint --chdir="$dir" --config="$PWD/.tflint.hcl"
          done
